name: OPChase Pro waitlist
description: Join the OPChase Pro waitlist (not launched yet; planned about $5/month or $40/year). This issue is public, so please do not post your email address.
title: "[Waitlist] OPChase Pro"
labels: ["waitlist"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in **OPChase Pro**. Pro is not launched yet and nothing is charged. The index, card pages and live eBay listings stay free.
        We'll reply on this issue (GitHub notifies you) when Pro opens. **Please don't post your email here, since issues are public.**
  - type: textarea
    id: features
    attributes:
      label: Which feature matters most to you? (optional)
      description: "Planned: full PSA 10 sales history and charts, collection valuation, weekly OPChase 100 market reports. (OPChase Index price alerts are free for everyone, not part of Pro.)"
      placeholder: "- Full PSA 10 sales history and charts"
  - type: textarea
    id: notes
    attributes:
      label: Anything else? (optional)
      description: Cards you follow, a fair price for Pro, other features.
