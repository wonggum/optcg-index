name: OPChase Pro (paused)
description: OPChase Pro is paused and not planned right now. Nothing is sold or charged. Please use "Report a listing or card problem" or a blank issue instead.
title: "[Feedback] "
labels: ["waitlist"]
body:
  - type: markdown
    attributes:
      value: |
        **OPChase Pro is paused** (2026-10-07). There is no waitlist and nothing is sold or charged. OPChase shows verified PSA 10 listings from eBay, a card database and version guides, all free.
        Issues are public, so **please don't post your email address here.**
  - type: textarea
    id: notes
    attributes:
      label: Feedback (optional)
      description: What would you like OPChase to add?
